name: Proposta
description: Proponi una decisione o un cambiamento per AlacreOS.
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Cosa vorresti risolvere e per chi?
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Cosa cambieresti e come capiresti se funziona?
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternative
      description: Quali altre opzioni hai considerato?
