name: Proposal
description: Propose a decision or change for AlacreOS.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would you solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you change, and how would you verify it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What other options did you consider?
