name: Proposal
description: Propose a decision or change for AlacreOS.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem and link the relevant section of the architecture specification.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change, its assumptions, and the evidence you would use to evaluate it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What other options did you consider?
