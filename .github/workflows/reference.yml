name: Reference analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  edf:
    name: EDF admission example
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s examples/edf -v
      - run: python3 examples/edf/admission.py

  kernel:
    name: Kernel build and boot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-arm qemu-system-x86
      - run: make -j2 test smoke
